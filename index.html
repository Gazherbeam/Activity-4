<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Web Dev Backend Project</title>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="p-8 space-y-4">
	<h1 class="text-3xl font-bold mb-6">NodeJS Backend API Demo</h1>
	
	<!-- API Control Section -->
	<div class="flex gap-4 items-end flex-wrap">
		<button id='get' class="p-3 bg-green-400 rounded-xl font-semibold hover:bg-green-500">GET</button>
		<div class="flex flex-col">
			<label class="font-semibold">Identity (ID):</label>
			<input id="identity" type='number' class="bg-gray-300 rounded-xl p-2 h-8 w-32" value="1">
		</div>
		<button id='post' class="p-3 bg-blue-400 rounded-xl font-semibold hover:bg-blue-500">POST</button>
		<button id='get2' class="p-3 bg-purple-400 rounded-xl font-semibold hover:bg-purple-500">EXPOSE DPWH</button>
	</div>

	<!-- Response Messages Section -->
	<div class="space-x-4 space-y-2">
		<span id="success" class="text-xl text-green-500 font-semibold"></span>
		<span id="error" class="text-xl text-red-500 font-semibold"></span>
		<span id="message" class="text-lg italic text-gray-700"></span>
	</div>

	<!-- Tabs Section -->
	<div class="space-y-4">
		<h2 class="text-2xl font-bold">Select Category</h2>
		<div class="space-x-2">
			<button class="tab p-3 bg-blue-200 rounded-xl font-semibold hover:bg-blue-300">Dogs</button>
			<button class="tab p-3 bg-blue-200 rounded-xl font-semibold hover:bg-blue-300">Cats</button>
			<button class="tab p-3 bg-blue-200 rounded-xl font-semibold hover:bg-blue-300">Snails</button>
		</div>
	</div>

	<!-- Content Display Section -->
	<div class="mt-6 p-4 bg-gray-100 rounded-lg">
		<div id="title" class="text-lg font-bold text-blue-600"></div>
		<div id="description" class="text-base text-gray-700 mt-2"></div>
	</div>

	<script src="js/1.js"></script>
	<script src="js/2.js"></script>
</body>

</html>
